<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Revenue - ABI</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="revenue.css">
    <script defer src="theme.js"></script>
</head>

<body>

    <nav class="navbar">
        <a href="dashboard.html" class="nav-logo" style="text-decoration: none;">ABI</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="inventory.html">Inventory</a>
            <a href="login.html">Log Out</a>
        </div>
    </nav>

    <main class="dashboard">
        <h1>Revenue Overview</h1>
        <p class="subtitle">Financial performance analysis</p>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="card stat-card slide-up delay-100">
                <span>Total Revenue</span>
                <h2>$124,500</h2>
                <span class="trend up">▲ 12% vs last month</span>
            </div>
            <div class="card stat-card slide-up delay-200">
                <span>Net Profit</span>
                <h2>$45,200</h2>
                <span class="trend up">▲ 8% vs last month</span>
            </div>
            <div class="card stat-card slide-up delay-300">
                <span>Avg. Order Value</span>
                <h2>$85</h2>
                <span class="trend down">▼ 2% vs last month</span>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="card chart-container slide-up delay-400">
            <h3>Revenue Growth (YTD)</h3>
            <div class="chart-placeholder">
                <div class="bar" style="height: 40%"></div>
                <div class="bar" style="height: 55%"></div>
                <div class="bar" style="height: 45%"></div>
                <div class="bar" style="height: 70%"></div>
                <div class="bar" style="height: 60%"></div>
                <div class="bar" style="height: 85%"></div>
                <div class="bar" style="height: 75%"></div>
                <div class="bar" style="height: 90%"></div>
            </div>
            <p style="margin-top:20px; color:var(--text-muted); font-size:0.9rem;">Visual representation of monthly
                revenue</p>
        </div>

    </main>

</body>

</html>
