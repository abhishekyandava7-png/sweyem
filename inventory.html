<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Inventory - ABI</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="inventory.css">
    <script defer src="theme.js"></script>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="dashboard.html" class="nav-logo" style="text-decoration: none;">ABI</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="settings.html">Settings</a>
            <a href="login.html">Log Out</a>
        </div>
    </nav>

    <!-- CONTENT -->
    <main class="dashboard">
        <h1>Inventory Management</h1>
        <p class="subtitle">Track stock levels and alerts</p>

        <div class="inventory-container slide-up delay-100">
            <div class="card">
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Item Name</th>
                                <th>SKU</th>
                                <th>Stock</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Wireless Headphones</td>
                                <td>WH-001</td>
                                <td>45</td>
                                <td><span class="status healthy">In Stock</span></td>
                                <td><button class="action-btn">Manage</button></td>
                            </tr>
                            <tr>
                                <td>Smart Watch Gen 2</td>
                                <td>SW-022</td>
                                <td>8</td>
                                <td><span class="status critical">Low Stock</span></td>
                                <td><button class="action-btn">Restock</button></td>
                            </tr>
                            <tr>
                                <td>Bluetooth Speaker</td>
                                <td>BS-105</td>
                                <td>120</td>
                                <td><span class="status healthy">In Stock</span></td>
                                <td><button class="action-btn">Manage</button></td>
                            </tr>
                            <tr>
                                <td>Laptop Stand</td>
                                <td>LS-099</td>
                                <td>0</td>
                                <td><span class="status danger">Out of Stock</span></td>
                                <td><button class="action-btn">Order</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

</body>

</html>
